<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ITDS261 Midterm Quiz</title>
<script>
try { var __t = JSON.parse(localStorage.getItem('itds261q:v1:theme')); if (__t === 'light' || __t === 'dark') document.documentElement.setAttribute('data-theme', __t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root {
  --font: 'Sarabun', 'Leelawadee UI', 'Noto Sans Thai', Tahoma, sans-serif;
  --bg: #F6F1E9;
  --surface: #FFFDF8;
  --ink: #1F1B16;
  --muted: #6B6258;
  --line: #DDD3C4;
  --line2: #9A8E7E;
  --accent: #B5471F;
  --on-accent: #FFFFFF;
  --tint: #F3E3D8;
  --ok: #1E6B3A;
  --okbg: #E3F0E5;
  --bad: #A3262A;
  --badbg: #F8E2E0;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1713; --surface: #231F1A; --ink: #EFE8DC; --muted: #A89E90;
    --line: #3A342C; --line2: #7A7062; --accent: #E8895C; --on-accent: #1A1713;
    --tint: #3A2A21; --ok: #7CC495; --okbg: #1F3326; --bad: #F09A9A; --badbg: #3A2222;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1713; --surface: #231F1A; --ink: #EFE8DC; --muted: #A89E90;
  --line: #3A342C; --line2: #7A7062; --accent: #E8895C; --on-accent: #1A1713;
  --tint: #3A2A21; --ok: #7CC495; --okbg: #1F3326; --bad: #F09A9A; --badbg: #3A2222;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 18px; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
.brand { background: none; border: 0; padding: 6px 0; font-weight: 700; font-size: 17px; letter-spacing: 0; text-align: left; }
.brand span { color: var(--muted); font-weight: 500; }
.theme { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1.5px solid var(--line2); border-radius: var(--r); background: var(--surface); font-size: 15px; font-weight: 500; }
.theme:hover { border-color: var(--ink); }
.theme svg { width: 18px; height: 18px; flex: none; }

/* ---------- ปุ่ม ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: var(--r); border: 1.5px solid var(--line2); background: var(--surface); font-weight: 600; font-size: 17px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn[aria-disabled="true"]:hover { border-color: var(--line2); filter: none; }
.btn.small { min-height: 38px; padding: 0 14px; font-size: 15px; }
.btn svg { width: 18px; height: 18px; }

/* ---------- หน้าแรก ---------- */
.home { padding-top: 36px; padding-bottom: 72px; }
.home h1 { font-size: 30px; line-height: 1.3; margin: 0 0 10px; font-weight: 700; }
.home .lead { margin: 0 0 6px; color: var(--muted); font-size: 17px; }
.facts { margin: 22px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 16px; color: var(--muted); }
.facts strong { color: var(--ink); font-weight: 600; }
.modebox { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
.modebox h2, .sets h2 { margin: 0 0 12px; font-size: 20px; font-weight: 700; }
.seg { display: inline-flex; border: 1.5px solid var(--line2); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 0 22px; min-height: 46px; font-weight: 600; font-size: 17px; }
.seg button + button { border-left: 1.5px solid var(--line2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.modedesc { margin: 12px 0 0; color: var(--muted); font-size: 16px; max-width: 60ch; }
.sets { margin-top: 36px; }
.setlist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.setrow { display: grid; grid-template-columns: 56px 1fr; column-gap: 18px; padding: 24px 0; border-bottom: 1px solid var(--line); }
.setno { font-size: 44px; font-weight: 700; line-height: 1; color: var(--accent); }
.setrow h3 { margin: 0; font-size: 21px; line-height: 1.4; font-weight: 700; }
.setrow h3 .lv { font-weight: 500; color: var(--muted); font-size: 16px; margin-left: 8px; }
.setrow p { margin: 6px 0 0; color: var(--muted); font-size: 16px; line-height: 1.65; }
.setmeta { margin-top: 8px; font-size: 15px; color: var(--muted); }
.setact { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.note { margin-top: 36px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); font-size: 15px; color: var(--muted); line-height: 1.7; }
.note strong { color: var(--ink); }

/* ---------- ส่วนหัวของข้อสอบ ---------- */
.qbar { position: sticky; top: 57px; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.qbar .wrap { padding-top: 10px; padding-bottom: 10px; }
.qbar .row { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--muted); }
.qbar .row b { color: var(--ink); font-weight: 600; }
.prog { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }
.quiz { padding-top: 22px; padding-bottom: 120px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.chip { display: inline-block; padding: 1px 10px; border: 1px solid var(--line2); border-radius: 6px; font-size: 14px; color: var(--muted); line-height: 1.7; background: var(--surface); }
.chip.strong { color: var(--ink); font-weight: 600; }
.qno { font-size: 15px; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
.qtext { font-size: 21px; line-height: 1.6; font-weight: 600; margin: 0 0 6px; }
.qhint { margin: 0 0 18px; font-size: 15px; color: var(--muted); }
.ctx { margin: 0 0 18px; padding: 14px 16px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--surface); font-size: 16px; line-height: 1.7; }
.ctx h3 { margin: 0 0 4px; font-size: 15px; font-weight: 700; color: var(--accent); }
.ctx p { margin: 0; }

/* ---------- ตัวเลือก ---------- */
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: flex-start; width: 100%; text-align: left; padding: 13px 16px; border: 1.5px solid var(--line2); border-radius: var(--r); background: var(--surface); min-height: 54px; line-height: 1.6; }
.opt:hover { border-color: var(--ink); }
.opt .mark { flex: none; width: 30px; height: 30px; border: 1.5px solid var(--line2); border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 15px; margin-top: 1px; }
.opt .body { flex: 1; min-width: 0; }
.opt .tag { display: block; margin-top: 4px; font-size: 14px; font-weight: 700; }
.opt.sel { border-color: var(--accent); background: var(--tint); }
.opt.sel .mark { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--okbg); }
.opt.right .mark { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.opt.right .tag { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--badbg); }
.opt.wrong .mark { background: var(--bad); border-color: var(--bad); color: var(--bg); }
.opt.wrong .tag { color: var(--bad); }
.opt.lock { cursor: default; }
.opt.lock:hover { border-color: var(--line2); }
.opt.right.lock:hover { border-color: var(--ok); }
.opt.wrong.lock:hover { border-color: var(--bad); }
.opt .mark svg { width: 16px; height: 16px; }

/* ---------- เรียงลำดับ ---------- */
.ordbox h4, .poolh { margin: 0 0 8px; font-size: 15px; font-weight: 700; color: var(--muted); }
.slots { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
.slot { display: flex; gap: 12px; align-items: center; min-height: 52px; padding: 8px 14px; border: 1.5px dashed var(--line2); border-radius: var(--r); color: var(--muted); font-size: 16px; }
.slot .n { flex: none; width: 28px; height: 28px; border-radius: 6px; border: 1.5px solid var(--line2); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.slot.filled { border-style: solid; background: var(--surface); color: var(--ink); }
.slot.filled button { all: unset; cursor: pointer; flex: 1; min-width: 0; line-height: 1.55; }
.slot.filled button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
.slot.filled:hover { border-color: var(--ink); }
.slot.right { border-color: var(--ok); background: var(--okbg); }
.slot.wrong { border-color: var(--bad); background: var(--badbg); }
.slot .st { flex: none; font-size: 14px; font-weight: 700; }
.slot.right .st { color: var(--ok); }
.slot.wrong .st { color: var(--bad); }
.pool { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
.pill { padding: 9px 14px; border: 1.5px solid var(--line2); border-radius: var(--r); background: var(--surface); font-size: 16px; line-height: 1.55; text-align: left; }
.pill:hover { border-color: var(--ink); }
.answer-key { margin-top: 6px; padding: 12px 16px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--surface); font-size: 16px; }
.answer-key h4 { margin: 0 0 6px; font-size: 15px; color: var(--ok); }
.answer-key ol { margin: 0; padding-left: 22px; }

/* ---------- จับคู่ ---------- */
.mrows { display: grid; gap: 12px; }
.mrow { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 12px 14px; border: 1.5px solid var(--line2); border-radius: var(--r); background: var(--surface); }
.mrow.right { border-color: var(--ok); background: var(--okbg); }
.mrow.wrong { border-color: var(--bad); background: var(--badbg); }
.mrow .ml { font-weight: 600; line-height: 1.6; }
.mrow select { width: 100%; min-height: 46px; padding: 6px 10px; border: 1.5px solid var(--line2); border-radius: 6px; background: var(--bg); font-size: 16px; }
.mrow .fixed { font-size: 15px; font-weight: 600; }
.mrow.right .fixed { color: var(--ok); }
.mrow.wrong .fixed { color: var(--bad); }

/* ---------- แผนภาพ ---------- */
.fig { margin: 4px 0 18px; padding: 12px; border: 1px solid var(--line2); border-radius: var(--r); background: var(--surface); overflow-x: auto; }
.fig svg { display: block; margin: 0 auto; height: auto; }
.fig .scrollhint { display: none; margin: 8px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
@media (max-width: 620px) { .fig .scrollhint { display: block; } }
.fig text { fill: var(--ink); font-family: var(--font); font-size: 14px; }
.fig .ln { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.fig .dash { stroke-dasharray: 6 4; }
.fig .sh { stroke: var(--ink); stroke-width: 1.6; fill: var(--surface); }
.fig .bd { stroke: var(--muted); stroke-width: 1.6; fill: none; }
.fig .mk { fill: var(--ink); }
.fig .mko { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.fig .lbl { paint-order: stroke; stroke: var(--surface); stroke-width: 6px; stroke-linejoin: round; font-size: 13px; }
.fig .hit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; }
.fig .hr { fill: transparent; }
.fig .hot { cursor: pointer; outline: none; }
.fig .hl { fill: none; stroke: transparent; stroke-width: 2.5; pointer-events: none; }
.fig .hot:hover .hl { stroke: var(--accent); stroke-dasharray: 5 4; }
.fig .hot:focus-visible .hl { stroke: var(--accent); stroke-dasharray: 5 4; }
.fig .hot.sel .hl { stroke: var(--accent); stroke-dasharray: none; fill: var(--tint); fill-opacity: .9; }
.fig .hot.right .hl { stroke: var(--ok); stroke-dasharray: none; fill: var(--okbg); fill-opacity: 1; }
.fig .hot.wrong .hl { stroke: var(--bad); stroke-dasharray: none; fill: var(--badbg); fill-opacity: 1; }
.fig.locked .hot { cursor: default; }
.fig.locked .hot:hover .hl { stroke: transparent; }
.fig.locked .hot.sel .hl, .fig.locked .hot.right .hl, .fig.locked .hot.wrong .hl { stroke-dasharray: none; }
.fig.locked .hot.right:hover .hl { stroke: var(--ok); }
.fig.locked .hot.wrong:hover .hl { stroke: var(--bad); }

/* ---------- เฉลย ---------- */
.fb { margin-top: 22px; padding: 16px 18px; border: 1.5px solid var(--line2); border-radius: var(--r); background: var(--surface); }
.fb.ok { border-color: var(--ok); }
.fb.no { border-color: var(--bad); }
.fb h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 18px; font-weight: 700; }
.fb.ok h3 { color: var(--ok); }
.fb.no h3 { color: var(--bad); }
.fb.skip h3 { color: var(--muted); }
.fb h3 svg { width: 20px; height: 20px; flex: none; }
.fb p { margin: 6px 0 0; font-size: 17px; line-height: 1.75; }
.fb .src { font-size: 14px; color: var(--muted); margin-top: 10px; }
.fb strong { font-weight: 700; }

/* ---------- แถบปุ่มล่าง + ไปที่ข้อ ---------- */
.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--bg); border-top: 1px solid var(--line); }
.actions .wrap { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 12px; padding-bottom: 12px; }
.actions .right { display: flex; gap: 10px; }
.jump { margin-top: 28px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.jump summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 16px; }
.jump .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; padding: 4px 16px 16px; }
.jn { position: relative; min-height: 44px; border: 1.5px solid var(--line2); border-radius: 6px; background: var(--bg); font-weight: 600; font-size: 15px; }
.jn.ans { background: var(--tint); border-color: var(--accent); }
.jn.ok { background: var(--okbg); border-color: var(--ok); color: var(--ok); }
.jn.no { background: var(--badbg); border-color: var(--bad); color: var(--bad); }
.jn.cur { outline: 3px solid var(--ink); outline-offset: 1px; }
.jn svg { position: absolute; right: 3px; top: 3px; width: 11px; height: 11px; }
.legend { padding: 0 16px 14px; font-size: 13px; color: var(--muted); }
.confirm { margin-top: 18px; padding: 16px 18px; border: 1.5px solid var(--accent); border-radius: var(--r); background: var(--tint); }
.confirm p { margin: 0 0 12px; }
.confirm .row { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- ผลคะแนน ---------- */
.result { padding-top: 36px; padding-bottom: 72px; }
.result h1 { margin: 0; font-size: 20px; font-weight: 700; color: var(--muted); }
.score { display: flex; align-items: baseline; gap: 12px; margin: 6px 0 4px; }
.score .big { font-size: 72px; font-weight: 700; line-height: 1.1; }
.score .of { font-size: 28px; color: var(--muted); font-weight: 500; }
.pct { margin: 0 0 24px; font-size: 18px; color: var(--muted); }
.result h2 { margin: 28px 0 10px; font-size: 19px; font-weight: 700; }
.bd-row { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.bd-row .name { line-height: 1.5; }
.bd-row .num { font-weight: 700; font-variant-numeric: tabular-nums; }
.bd-row .bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.bd-row .bar i { display: block; height: 100%; background: var(--accent); }
.wrongs { display: flex; flex-wrap: wrap; gap: 8px; }
.rbtns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }

@media (max-width: 520px) {
  body { font-size: 17px; }
  .home h1 { font-size: 26px; }
  .setrow { grid-template-columns: 1fr; row-gap: 6px; }
  .setno { font-size: 34px; }
  .qtext { font-size: 19px; }
  .score .big { font-size: 60px; }
  .theme .lab { display: none; }
  .theme { padding: 0 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="homeBtn" aria-label="กลับหน้าแรก">ITDS261 <span>ข้อสอบกลางภาค</span></button>
    <button class="theme" id="themeBtn" type="button"></button>
  </div>
</header>
<main id="app"></main>
<noscript><div class="wrap" style="padding:32px 16px">หน้านี้ต้องเปิด JavaScript เพื่อทำข้อสอบ</div></noscript>
<script>
/* ---------- ตัวช่วยสร้างข้อสอบ ---------- */
window.SETS = [];
const mk = {
  mcq: (src, q, ok, bad, why, o) => Object.assign({ t: 'mcq', src, q, opts: [ok].concat(bad), why }, o),
  tf: (src, q, a, why, o) => Object.assign({ t: 'tf', src, q, a, why }, o),
  order: (src, q, items, why, o) => Object.assign({ t: 'order', src, q, items, why }, o),
  match: (src, q, pairs, why, o) => Object.assign({ t: 'match', src, q, pairs, why }, o),
  spot: (src, q, fig, ans, why, o) => Object.assign({ t: 'spot', src, q, fig, ans, why }, o),
};

/* ---------- ตัวสร้างแผนภาพ SVG ---------- */
const F = (function () {
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const DEFS =
    '<defs>' +
    '<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="mk" d="M0 0L10 5L0 10z"/></marker>' +
    '<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path class="mko" d="M1 1L9 5L1 9"/></marker>' +
    '</defs>';

  function wrap(w, h, inner, alt, interactive) {
    return {
      alt: alt,
      interactive: !!interactive,
      svg:
        '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;max-width:' + w + 'px;min-width:' + Math.min(w, 560) +
        'px" role="' + (interactive ? 'group' : 'img') + '" aria-label="' + esc(alt) + '">' + DEFS + inner + '</svg>',
    };
  }
  const hot = (id, label, inner) =>
    id
      ? '<g class="hot" data-id="' + id + '" role="button" tabindex="0" aria-label="' + esc(label) + '">' + inner + '</g>'
      : '<g>' + inner + '</g>';
  const txt = (x, y, s, o) => {
    o = o || {};
    return '<text x="' + x + '" y="' + y + '" text-anchor="' + (o.a || 'middle') + '"' +
      (o.c ? ' class="' + o.c + '"' : '') + (o.w ? ' font-weight="' + o.w + '"' : '') +
      (o.s ? ' font-size="' + o.s + '"' : '') + '>' + esc(s) + '</text>';
  };
  const lines = (cx, cy, arr, o) => {
    const lh = 18, y0 = cy - ((arr.length - 1) * lh) / 2 + 5;
    return arr.map((s, i) => txt(cx, y0 + i * lh, s, o)).join('');
  };

  /* ---- use case ---- */
  const actor = (x, y, label, id) =>
    hot(id, label,
      '<rect class="hr" x="' + (x - 38) + '" y="' + (y - 14) + '" width="76" height="106"/>' +
      '<circle class="sh" cx="' + x + '" cy="' + y + '" r="10"/>' +
      '<path class="ln" d="M' + x + ' ' + (y + 10) + 'V' + (y + 42) + 'M' + (x - 18) + ' ' + (y + 22) + 'H' + (x + 18) +
      'M' + x + ' ' + (y + 42) + 'L' + (x - 14) + ' ' + (y + 64) + 'M' + x + ' ' + (y + 42) + 'L' + (x + 14) + ' ' + (y + 64) + '"/>' +
      txt(x, y + 84, label));
  const uc = (cx, cy, label, id, rx) =>
    hot(id, label, '<ellipse class="sh" cx="' + cx + '" cy="' + cy + '" rx="' + (rx || 84) + '" ry="26"/>' + txt(cx, cy + 5, label));
  const box = (x, y, w, h, title, id) =>

  return { library, zooInclude, context, spiralGrid, dfdSymbols };
})();

        ['แสดงข้อมูลทั่วไปก่อน แล้วค่อยแสดงรายละเอียดเพิ่ม', 'Reduce the user’s memory load'],

      'ถูก Phase 4: ทดสอบว่า implement ทุก user task ถูกต้อง รองรับ task variations ครบ ตอบ general user requirements และประเมิน **easy to use / easy to learn** รวมถึงผู้ใช้ยอมรับ interface เป็นเครื่องมือที่มีประโยชน์'),

    mk.mcq('L8', 'ข้อใดคือ design issues ทั้ง 3 เรื่องของ Phase 2 (Interface design) ตามสไลด์',

      ['Response time, Hardware cost และ Error handling', 'Command structure, User skill และ Prototype', 'Error handling, Task variations และ Physical environment'],

    mk.order('L8', 'เรียงงานต่อไปนี้ของโปรเจกต์ออกแบบแอปจองคิวคลินิกตาม 4 phase ของ UI Design Process',

<script>
(function () {
  'use strict';
  const KEY = 'itds261q:v1';
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ใช้ต่อได้แม้ไม่มี storage */ } },
  };

  const SRC = {
    L1: 'Lecture 1 · SE Foundation และ Project Management',
    L2: 'Lecture 2 · Software Process',
    L3: 'Lecture 3 · Requirements Engineering',
    L4: 'Lecture 4 · Use Case และ Narrative',
    L7: 'Lecture 7 · Data Flow Diagram',
    L8: 'Lecture 8 · User Interface Design',
  };
  const TYPE_LABEL = { mcq: 'ปรนัย', tf: 'ถูก / ผิด', order: 'เรียงลำดับ', match: 'จับคู่', spot: 'คลิกจุดผิดในแผนภาพ' };
  const TYPE_HINT = {
    mcq: 'เลือกคำตอบที่ถูกที่สุด 1 ข้อ',
    tf: 'ข้อความนี้ถูกหรือผิด',
    order: 'แตะรายการตามลำดับที่ถูกต้อง แตะรายการที่เลือกแล้วเพื่อนำออก',
    match: 'เลือกคำตอบที่ตรงกันของแต่ละแถว',
    spot: 'คลิกหรือกด Enter บนส่วนของแผนภาพที่ผิด',
  };
  const TH = ['ก', 'ข', 'ค', 'ง', 'จ'];
  const SETS = window.SETS;

  /* ---------- ตัวช่วย ---------- */
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  const svgi = (d, extra) => '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + d + '</svg>';
  const IC = {
    check: svgi('<path d="M4 10.5l4 4 8-9"/>'),
    x: svgi('<path d="M5 5l10 10M15 5L5 15"/>'),
    sun: svgi('<circle cx="10" cy="10" r="3.6"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M4.3 15.7l1.6-1.6M14.1 5.9l1.6-1.6"/>'),
    moon: svgi('<path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7z"/>'),
    left: svgi('<path d="M12 4l-6 6 6 6"/>'),
    right: svgi('<path d="M8 4l6 6-6 6"/>'),
  };
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function perm(n, seed, qi, avoidIdentity) {
    const r = rng(seed * 131 + qi * 7919 + 1);
    const a = Array.from({ length: n }, (_, k) => k);
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
    if (avoidIdentity && n > 1 && a.every((v, k) => v === k)) a.push(a.shift());
    return a;
  }
  const choicesOf = q => Array.from(new Set(q.pairs.map(p => p[1]).concat(q.extra || [])));

  function isAnswered(q, a) {
    if (a === undefined || a === null) return false;
    if (q.t === 'order') return Array.isArray(a) && a.length === q.items.length;
    if (q.t === 'match') return Array.isArray(a) && a.length === q.pairs.length && a.every(v => v);
    return true;
  }
  function isRight(q, a) {
    if (!isAnswered(q, a)) return false;
    switch (q.t) {
      case 'mcq': return a === 0;
      case 'tf': return a === q.a;
      case 'order': return a.every((v, k) => v === k);
      case 'match': return a.every((v, k) => v === q.pairs[k][1]);
      case 'spot': return a === q.ans;
    }
    return false;
  }

  /* ---------- state ---------- */
  const $app = document.getElementById('app');
  const ui = { view: 'home', mode: store.get(KEY + ':mode') === 'exam' ? 'exam' : 'practice', arm: null, confirm: null, focus: null, jumpOpen: false };
  let run = null, set = null;

  const setById = id => SETS.find(s => s.id === id);
  const runKey = (sid, mode, retry) => KEY + ':run:' + sid + ':' + mode + (retry ? ':retry' : '');
  const newRun = (s, mode, ids, retry) => ({ setId: s.id, mode: mode, retry: !!retry, ids: ids || s.qs.map((_, i) => i), seed: (Math.random() * 2147483647) | 0, idx: 0, ans: {}, chk: {}, done: false });
  const loadRun = (s, mode) => { const r = store.get(runKey(s.id, mode, false)); return r && Array.isArray(r.ids) && r.ids.length === s.qs.length ? r : null; };
  const save = () => store.set(runKey(run.setId, run.mode, run.retry), run);
  function calc(s, r) {
    let right = 0; const per = {}, wrong = [];
    r.ids.forEach((qi, p) => {
      const q = s.qs[qi]; const ok = isRight(q, r.ans[qi]);
      const b = per[q.src] || (per[q.src] = { r: 0, t: 0 });
      b.t++; if (ok) { b.r++; right++; } else wrong.push(p);
    });
    return { right: right, total: r.ids.length, per: per, wrong: wrong };
  }

  /* ---------- ธีม ---------- */
  const root = document.documentElement;
  const sysDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
  const curTheme = () => root.getAttribute('data-theme') || (sysDark() ? 'dark' : 'light');
  function paintTheme() {
    const toDark = curTheme() === 'light';
    const b = document.getElementById('themeBtn');
    b.innerHTML = (toDark ? IC.moon : IC.sun) + '<span class="lab">' + (toDark ? 'ธีมมืด' : 'ธีมสว่าง') + '</span>';
    b.setAttribute('aria-label', toDark ? 'สลับเป็นธีมมืด' : 'สลับเป็นธีมสว่าง');
  }
  document.getElementById('themeBtn').addEventListener('click', () => {
    const n = curTheme() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', n); store.set(KEY + ':theme', n); paintTheme();
  });
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintTheme); } catch (e) { /* เบราว์เซอร์เก่า */ }
  document.getElementById('homeBtn').addEventListener('click', () => { ui.view = 'home'; ui.confirm = null; render(); window.scrollTo(0, 0); });

  /* ---------- หน้าแรก ---------- */
  function homeHTML() {
    const last = store.get(KEY + ':last') || {};
    const rows = SETS.map(s => {
      const r = loadRun(s, ui.mode);
      const l = last[s.id + ':' + ui.mode];
      let btns;
      const arm = ui.arm === s.id;
      const resetBtn = (label) => arm
        ? '<button class="btn small" data-act="restart" data-id="' + s.id + '">ยืนยัน: ล้างคำตอบแล้วเริ่มใหม่</button>'
        : '<button class="btn small ghost" data-act="arm" data-id="' + s.id + '">' + label + '</button>';
      if (r && r.done) {
        const t = calc(s, r);
        btns = '<button class="btn primary" data-act="start" data-id="' + s.id + '">ดูผล ' + t.right + '/' + t.total + '</button>' + resetBtn('ทำใหม่');
      } else if (r && (Object.keys(r.ans).length || r.idx > 0)) {
        btns = '<button class="btn primary" data-act="start" data-id="' + s.id + '">ทำต่อ · ข้อ ' + (r.idx + 1) + '/' + s.qs.length + '</button>' + resetBtn('เริ่มใหม่');
      } else {
        btns = '<button class="btn primary" data-act="start" data-id="' + s.id + '">เริ่มทำ</button>';
      }
      const meta = s.qs.length + ' ข้อ' + (l ? ' · ครั้งล่าสุดในโหมดนี้ ' + l.right + '/' + l.total : '');
      return '<li class="setrow"><div class="setno" aria-hidden="true">' + s.id + '</div><div>' +
        '<h3>ชุด ' + s.id + ' · ' + esc(s.tag) + '<span class="lv">ระดับ' + esc(s.level) + '</span></h3>' +
        '<p>' + esc(s.desc) + '</p><div class="setmeta">' + meta + '</div><div class="setact">' + btns + '</div></div></li>';
    }).join('');
    const modeDesc = ui.mode === 'practice'
      ? 'ตอบแล้วเห็นเฉลยและเหตุผลทันที เหมาะตอนเรียนรู้ ข้อไหนผิดจะรู้ว่าผิดเพราะอะไรก่อนไปข้อต่อไป'
      : 'ทำจนจบทั้งชุดโดยไม่เห็นเฉลย กลับไปแก้คำตอบได้ แล้วค่อยส่งเพื่อดูคะแนนและเฉลยทุกข้อ เหมาะซ้อมสอบจริง';
    return '<div class="home wrap">' +
      '<h1>ข้อสอบฝึก ITDS261 Software Engineering</h1>' +
      '<p class="lead">เตรียมสอบกลางภาค ชุด 1–3 รวม 90 ข้อ (ชุดละ 30 ข้อ จากง่ายไปยาก) ชุด 4 เฉพาะ Interface Design และชุด 5–7 เฉพาะเนื้อหา Part 1 (L1, L2, L3, L8) อีก 90 ข้อ ชุดละ 30 ข้อ ความยากเท่ากันทุกชุด</p>' +
      '<ul class="facts"><li><strong>สอบ ศ. 9 ต.ค. 2569</strong> เวลา 12:30-14:30 · กลางภาคคิด 40%</li>' +
      '<li><strong>Part 1</strong> ทฤษฎี 15 คะแนน · <strong>Part 2</strong> วาด/เขียนโมเดล 25 คะแนน</li></ul>' +
      '<section class="modebox" aria-labelledby="modeh"><h2 id="modeh">เลือกโหมดทำ</h2>' +
      '<div class="seg" role="group" aria-label="โหมดทำข้อสอบ">' +
      '<button data-act="mode" data-m="practice" aria-pressed="' + (ui.mode === 'practice') + '">โหมดฝึก</button>' +
      '<button data-act="mode" data-m="exam" aria-pressed="' + (ui.mode === 'exam') + '">โหมดสอบ</button></div>' +
      '<p class="modedesc">' + modeDesc + '</p></section>' +
      '<section class="sets" aria-labelledby="seth"><h2 id="seth">เลือกชุดข้อสอบ</h2><ul class="setlist">' + rows + '</ul></section>' +
      '<div class="note"><strong>ที่มาของเนื้อหา:</strong> ตั้งขึ้นจากหน้าสรุป “ITDS261 Software Engineering Midterm Guideline” ใน Notion (Lecture 1, 2, 3, 4, 7) และสไลด์ Lecture 8 (ชุด 4) ข้อที่ผู้จัดทำตั้งสถานการณ์ใหม่จะระบุไว้ในเฉลยว่าเป็นโจทย์ฝึก ไม่ใช่ข้อสอบจริง ' +
      'เนื้อหา <strong>Interface Design</strong> (ออกสอบ Part 1) อยู่ในชุด 4 ที่ตั้งจากสไลด์ L8 โดยตรง ชุด 5–7 ตั้งจากสไลด์ L1, L2, L3, L8 ในไฟล์ guideline และสไลด์ L8 แต่ละชุดมีสัดส่วนเท่ากัน (L1 7 ข้อ, L2 8 ข้อ, L3 7 ข้อ, L8 8 ข้อ) ถ้าอาจารย์สอนต่างจากหน้าสรุป ให้ยึดตามอาจารย์</div>' +
      '</div>';
  }

  /* ---------- หน้าทำข้อสอบ ---------- */
  function figHTML(q, locked) {
    if (!q.fig) return '';
    return '<div class="fig' + (locked ? ' locked' : '') + '">' + q.fig.svg + '<p class="scrollhint">เลื่อนซ้าย-ขวาเพื่อดูแผนภาพทั้งหมด</p></div>';
  }

  function optsHTML(q, qi, a, fb) {
    let list;
    if (q.t === 'mcq') list = perm(q.opts.length, run.seed, qi).map(oi => ({ id: oi, txt: q.opts[oi], right: oi === 0 }));
    else list = [{ id: true, txt: 'ถูก', right: q.a === true }, { id: false, txt: 'ผิด', right: q.a === false }];
    return '<div class="opts" role="radiogroup" aria-label="ตัวเลือก">' + list.map((o, k) => {
      const sel = a === o.id;
      let cls = 'opt', tag = '', mark = TH[k];
      if (fb) {
        cls += ' lock';
        if (o.right) { cls += ' right'; tag = sel ? 'คุณเลือกข้อนี้ ถูกต้อง' : 'คำตอบที่ถูก'; mark = IC.check; }
        else if (sel) { cls += ' wrong'; tag = 'คุณเลือกข้อนี้ ยังไม่ถูก'; mark = IC.x; }
      } else if (sel) cls += ' sel';
      return '<button class="' + cls + '" role="radio" aria-checked="' + sel + '" data-act="pick" data-v="' + o.id + '"><span class="mark">' + mark + '</span><span class="body">' + fmt(o.txt) + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</span></button>';
    }).join('') + '</div>';
  }

  function orderHTML(q, qi, a, fb) {
    const placed = Array.isArray(a) ? a : [];
    const n = q.items.length;
    let slots = '';
    for (let k = 0; k < n; k++) {
      if (k < placed.length) {
        const it = placed[k];
        let cls = 'slot filled', st = '';
        if (fb) { const ok = it === k; cls += ok ? ' right' : ' wrong'; st = '<span class="st">' + (ok ? 'ถูก' : 'ผิดที่') + '</span>'; }
        slots += '<li class="' + cls + '"><span class="n">' + (k + 1) + '</span>' +
          (fb ? '<span style="flex:1">' + fmt(q.items[it]) + '</span>' : '<button data-act="unplace" data-k="' + k + '" aria-label="นำออก ลำดับที่ ' + (k + 1) + ': ' + esc(q.items[it]) + '">' + fmt(q.items[it]) + '</button>') + st + '</li>';
      } else slots += '<li class="slot"><span class="n">' + (k + 1) + '</span>' + (fb ? 'ยังไม่ได้เรียง' : 'ลำดับที่ ' + (k + 1)) + '</li>';
    }
    let html = '<div class="ordbox"><h4>ลำดับของคุณ</h4><ol class="slots">' + slots + '</ol>';
    if (!fb) {
      const pool = perm(n, run.seed, qi, true).filter(it => placed.indexOf(it) < 0);
      html += '<p class="poolh">รายการที่เหลือ (' + pool.length + ')</p><div class="pool">' +
        pool.map(it => '<button class="pill" data-act="place" data-it="' + it + '">' + fmt(q.items[it]) + '</button>').join('') + '</div>';
      if (placed.length) html += '<button class="btn small ghost" data-act="clear">ล้างลำดับทั้งหมด</button>';
    } else if (!isRight(q, a)) {
      html += '<div class="answer-key"><h4>ลำดับที่ถูกต้อง</h4><ol>' + q.items.map(t => '<li>' + fmt(t) + '</li>').join('') + '</ol></div>';
    }
    return html + '</div>';
  }

  function matchHTML(q, qi, a, fb) {
    const choices = choicesOf(q);
    const order = perm(choices.length, run.seed, qi);
    const cur = Array.isArray(a) ? a : [];
    return '<div class="mrows">' + q.pairs.map((p, k) => {
      const v = cur[k];
      if (fb) {
        const ok = v === p[1];
        return '<div class="mrow ' + (ok ? 'right' : 'wrong') + '"><div class="ml">' + fmt(p[0]) + '</div><div class="fixed">' +
          (v ? (ok ? 'ถูก: ' : 'คุณเลือก: ') + fmt(v) : 'ไม่ได้เลือก') + '</div>' + (ok ? '' : '<div class="fixed" style="color:var(--ok)">ที่ถูกต้อง: ' + fmt(p[1]) + '</div>') + '</div>';
      }
      return '<div class="mrow"><label class="ml" for="m' + k + '">' + fmt(p[0]) + '</label><select id="m' + k + '" data-act="match" data-k="' + k + '"><option value="">เลือกคำตอบ</option>' +
        order.map(ci => '<option value="' + ci + '"' + (v === choices[ci] ? ' selected' : '') + '>' + esc(choices[ci]) + '</option>').join('') + '</select></div>';
    }).join('') + '</div>';
  }

  function fbHTML(q, a) {
    const answered = isAnswered(q, a), ok = isRight(q, a);
    const cls = ok ? 'ok' : answered ? 'no' : 'skip';
    const head = ok ? IC.check + 'ถูกต้อง' : answered ? IC.x + 'ยังไม่ถูก' : 'ไม่ได้ตอบข้อนี้';
    let extra = '';
    if (q.t === 'tf') extra = '<p><strong>เฉลย: ข้อความนี้' + (q.a ? 'ถูกต้อง' : 'ผิด') + '</strong></p>';
    if (q.t === 'mcq' && !ok) extra = '<p><strong>คำตอบที่ถูก:</strong> ' + fmt(q.opts[0]) + '</p>';
    if (q.t === 'spot') extra = '<p><strong>จุดที่ผิดถูกไฮไลต์สีเขียวในแผนภาพ</strong></p>';
    return '<section class="fb ' + cls + '" role="status"><h3>' + head + '</h3>' + extra + '<p>' + fmt(q.why) + '</p><p class="src">อ้างอิง: ' + SRC[q.src] + '</p></section>';
  }

  function quizHTML() {
    const n = run.ids.length, pos = run.idx, qi = run.ids[pos], q = set.qs[qi];
    const a = run.ans[qi], done = run.done, fb = done || !!run.chk[qi];
    const answeredCount = run.ids.filter(i => isAnswered(set.qs[i], run.ans[i])).length;
    let body;
    if (q.t === 'mcq' || q.t === 'tf') body = optsHTML(q, qi, a, fb);
    else if (q.t === 'order') body = orderHTML(q, qi, a, fb);
    else if (q.t === 'match') body = matchHTML(q, qi, a, fb);
    else body = '';
    const chips = '<div class="chips"><span class="chip strong">' + TYPE_LABEL[q.t] + '</span><span class="chip">' + SRC[q.src] + '</span>' + (q.part ? '<span class="chip">' + q.part + '</span>' : '') + '</div>';
    const ctx = q.ctx ? '<aside class="ctx"><h3>' + esc(q.ctx.title) + '</h3><p>' + esc(q.ctx.body) + '</p></aside>' : '';
    const modeLab = done ? 'ดูเฉลย' : ui.mode === 'practice' ? 'โหมดฝึก' : 'โหมดสอบ';
    const retryLab = run.retry ? ' · ทำซ้ำเฉพาะข้อผิด' : '';

    /* แถบปุ่มล่าง */
    const isLast = pos === n - 1;
    const needsCheck = ui.mode === 'practice' && !fb && (q.t === 'order' || q.t === 'match' || q.t === 'spot');
    const canCheck = isAnswered(q, a);
    let right;
    if (done) right = isLast ? '<button class="btn primary" data-act="toresult">กลับไปหน้าผลคะแนน</button>' : '<button class="btn primary" data-act="next">ข้อถัดไป' + IC.right + '</button>';
    else if (needsCheck) right = '<button class="btn ghost" data-act="next">ข้าม</button><button class="btn primary" data-act="check" aria-disabled="' + !canCheck + '">ตรวจคำตอบ</button>';
    else if (isLast) right = '<button class="btn primary" data-act="finish">' + (ui.mode === 'exam' ? 'ส่งข้อสอบ' : 'ดูผลคะแนน') + '</button>';
    else right = '<button class="btn primary" data-act="next">ข้อถัดไป' + IC.right + '</button>';
    const actions = '<div class="actions"><div class="wrap"><button class="btn" data-act="prev" aria-disabled="' + (pos === 0) + '">' + IC.left + 'ก่อนหน้า</button><div class="right">' + right + '</div></div></div>';

    /* ตารางไปที่ข้อ */
    const grid = run.ids.map((i, p) => {
      const qq = set.qs[i], aa = run.ans[i], ans = isAnswered(qq, aa), f = done || run.chk[i];
      let cls = 'jn', st = ans ? 'ตอบแล้ว' : 'ยังไม่ตอบ', ic = '';
      if (f) { const ok = isRight(qq, aa); cls += ok ? ' ok' : ' no'; st = ok ? 'ถูก' : ans ? 'ผิด' : 'ไม่ได้ตอบ'; ic = ok ? IC.check : IC.x; }
      else if (ans) cls += ' ans';
      if (p === pos) cls += ' cur';
      return '<button class="' + cls + '" data-act="goto" data-p="' + p + '" aria-label="ข้อ ' + (p + 1) + ' ' + st + '"' + (p === pos ? ' aria-current="step"' : '') + '>' + (p + 1) + ic + '</button>';
    }).join('');
    const legend = (ui.mode === 'practice' || done) ? 'พื้นอ่อนสีส้ม = ตอบแล้ว · สีเขียวมีเครื่องหมายถูก = ถูก · สีแดงมีกากบาท = ผิดหรือไม่ได้ตอบ' : 'พื้นอ่อนสีส้ม = ตอบแล้ว (โหมดสอบจะเห็นเฉลยหลังส่งเท่านั้น)';
    const jump = '<details class="jump"' + (ui.jumpOpen ? ' open' : '') + '><summary>ไปที่ข้อ · ตอบแล้ว ' + answeredCount + '/' + n + '</summary><div class="grid">' + grid + '</div><div class="legend">' + legend + '</div></details>';

    /* กล่องยืนยันส่ง */
    let confirm = '';
    if (ui.confirm === 'finish') {
      const un = n - answeredCount;
      confirm = '<div class="confirm" role="alertdialog" aria-label="ยืนยัน"><p>' + (un ? '<strong>ยังไม่ได้ตอบ ' + un + ' ข้อ</strong> ข้อที่ไม่ได้ตอบจะนับเป็นผิด ' : '') + (ui.mode === 'exam' ? 'เมื่อส่งแล้วจะเห็นคะแนนและเฉลยทุกข้อ ส่งเลยไหม' : 'ดูผลคะแนนเลยไหม') + '</p><div class="row"><button class="btn" data-act="cancelfinish">กลับไปทำต่อ</button><button class="btn primary" data-act="confirmfinish">' + (ui.mode === 'exam' ? 'ส่งข้อสอบ' : 'ดูผลคะแนน') + '</button></div></div>';
    }

    const pct = Math.round(((pos + 1) / n) * 100);
    return '<div class="qbar"><div class="wrap"><div class="row"><span>ชุด ' + set.id + ' · ' + modeLab + retryLab + '</span><span><b>ข้อ ' + (pos + 1) + '</b> / ' + n + '</span></div><div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="' + n + '" aria-valuenow="' + (pos + 1) + '"><i style="width:' + pct + '%"></i></div></div></div>' +
      '<div class="quiz wrap"><h1 class="sr">ชุด ' + set.id + ' ' + esc(set.tag) + '</h1>' + chips + ctx +
      '<p class="qno">ข้อ ' + (pos + 1) + '</p><h2 class="qtext" tabindex="-1">' + fmt(q.q) + '</h2><p class="qhint">' + TYPE_HINT[q.t] + '</p>' +
      figHTML(q, fb) + body + (fb ? fbHTML(q, a) : '') + confirm + jump + '</div>' + actions;
  }

  /* ---------- หน้าผล ---------- */
  function resultHTML() {
    const t = calc(set, run);
    const pct = Math.round((t.right / t.total) * 100);
    const rows = Object.keys(SRC).filter(k => t.per[k]).map(k => {
      const b = t.per[k];
      return '<div class="bd-row"><span class="name">' + SRC[k] + '</span><span class="num">' + b.r + '/' + b.t + '</span><span class="bar"><i style="width:' + Math.round((b.r / b.t) * 100) + '%"></i></span></div>';
    }).join('');
    const wr = t.wrong.length
      ? '<h2>ข้อที่ยังไม่ถูก (' + t.wrong.length + ' ข้อ)</h2><div class="wrongs">' + t.wrong.map(p => '<button class="btn small" data-act="review" data-p="' + p + '" aria-label="ดูเฉลยข้อ ' + (p + 1) + '">ข้อ ' + (p + 1) + '</button>').join('') + '</div>'
      : '<h2>ถูกทุกข้อ</h2><p style="margin:0">ลองทำชุดถัดไป หรือสลับไปโหมดสอบเพื่อซ้อมแบบไม่เห็นเฉลย</p>';
    return '<div class="result wrap"><h1>ผลคะแนน · ชุด ' + set.id + ' ' + esc(set.tag) + ' · ' + (run.mode === 'exam' ? 'โหมดสอบ' : 'โหมดฝึก') + (run.retry ? ' · ทำซ้ำเฉพาะข้อผิด' : '') + '</h1>' +
      '<div class="score"><span class="big">' + t.right + '</span><span class="of">/ ' + t.total + '</span></div><p class="pct">ถูก ' + pct + '%</p>' +
      '<h2>แยกตามบทเรียน</h2>' + rows + wr +
      '<div class="rbtns"><button class="btn primary" data-act="review" data-p="' + (t.wrong.length ? t.wrong[0] : 0) + '">ดูเฉลยทีละข้อ</button>' +
      (t.wrong.length ? '<button class="btn" data-act="retry">ทำเฉพาะข้อที่ผิดซ้ำ (' + t.wrong.length + ' ข้อ)</button>' : '') +
      '<button class="btn" data-act="restart" data-id="' + set.id + '">ทำชุดนี้ใหม่</button><button class="btn ghost" data-act="home">กลับหน้าแรก</button></div></div>';
  }

  /* ---------- render ---------- */
  function decorateFigs() {
    $app.querySelectorAll('.fig').forEach(fig => {
      const q = run && ui.view === 'quiz' ? set.qs[run.ids[run.idx]] : null;
      fig.querySelectorAll('.hot').forEach(g => {
        try {
          const bb = g.getBBox();
          const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          r.setAttribute('class', 'hl');
          r.setAttribute('x', bb.x - 7); r.setAttribute('y', bb.y - 7);
          r.setAttribute('width', bb.width + 14); r.setAttribute('height', bb.height + 14); r.setAttribute('rx', 6);
          g.insertBefore(r, g.firstChild);
        } catch (e) { /* ไม่มี layout ให้ข้ามไป */ }
        if (!q) return;
        const a = run.ans[run.ids[run.idx]], id = g.getAttribute('data-id'), fb = run.done || run.chk[run.ids[run.idx]];
        if (fb) { if (id === q.ans) g.classList.add('right'); else if (id === a) g.classList.add('wrong'); }
        else if (id === a) g.classList.add('sel');
        g.setAttribute('aria-pressed', String(id === a));
      });
    });
  }
  function render() {
    if (ui.view === 'home') $app.innerHTML = homeHTML();
    else if (ui.view === 'result') $app.innerHTML = resultHTML();
    else $app.innerHTML = quizHTML();
    decorateFigs();
    paintTheme();
    if (ui.focus) { const f = $app.querySelector(ui.focus); if (f) f.focus({ preventScroll: true }); ui.focus = null; }
  }

  /* ---------- การกระทำ ---------- */
  function openRun(s, r, view) { set = s; run = r; ui.view = view; ui.confirm = null; ui.focus = view === 'quiz' ? '.qtext' : null; render(); window.scrollTo(0, 0); }
  function start(id) {
    const s = setById(id); let r = loadRun(s, ui.mode);
    if (!r) { r = newRun(s, ui.mode); store.set(runKey(s.id, ui.mode, false), r); }
    openRun(s, r, r.done ? 'result' : 'quiz');
  }
  function go(p) { run.idx = Math.max(0, Math.min(run.ids.length - 1, p)); ui.confirm = null; save(); ui.focus = '.qtext'; render(); window.scrollTo(0, 0); }
  function setAns(v) { const qi = run.ids[run.idx]; run.ans[qi] = v; save(); }
  function finish() {
    run.done = true; save();
    if (!run.retry) { const last = store.get(KEY + ':last') || {}; const t = calc(set, run); last[set.id + ':' + run.mode] = { right: t.right, total: t.total, ts: Date.now() }; store.set(KEY + ':last', last); }
    ui.view = 'result'; ui.confirm = null; render(); window.scrollTo(0, 0);
  }
  function tryFinish() {
    const un = run.ids.filter(i => !isAnswered(set.qs[i], run.ans[i])).length;
    if (run.mode === 'exam' || un > 0) { ui.confirm = 'finish'; render(); const c = $app.querySelector('.confirm'); if (c) c.scrollIntoView({ block: 'center' }); } else finish();
  }
  function check() {
    const qi = run.ids[run.idx], q = set.qs[qi];
    if (run.done || run.chk[qi] || !isAnswered(q, run.ans[qi])) return;
    run.chk[qi] = true; save(); render();
    const f = $app.querySelector('.fb'); if (f) f.scrollIntoView({ block: 'nearest', behavior: 'auto' });
  }
  function pick(v) {
    if (run.done) return;
    const qi = run.ids[run.idx], q = set.qs[qi];
    if (run.chk[qi]) return;
    setAns(q.t === 'mcq' ? Number(v) : v === 'true');
    if (run.mode === 'practice') run.chk[qi] = true;
    save(); ui.focus = '.opt[aria-checked="true"]'; render();
    if (run.mode === 'practice') { const f = $app.querySelector('.fb'); if (f) f.scrollIntoView({ block: 'nearest', behavior: 'auto' }); }
  }
  function locked() { const qi = run.ids[run.idx]; return run.done || !!run.chk[qi]; }

  const act = {
    home() { ui.view = 'home'; render(); window.scrollTo(0, 0); },
    mode(el) { ui.mode = el.dataset.m; store.set(KEY + ':mode', ui.mode); ui.arm = null; render(); },
    arm(el) { ui.arm = Number(el.dataset.id); render(); },
    start(el) { start(Number(el.dataset.id)); },
    restart(el) { const s = setById(Number(el.dataset.id)); const mode = run && run.setId === s.id && ui.view === 'result' ? run.mode : ui.mode; ui.arm = null; const r = newRun(s, mode); store.set(runKey(s.id, mode, false), r); if (mode !== ui.mode) { ui.mode = mode; store.set(KEY + ':mode', mode); } openRun(s, r, 'quiz'); },
    pick(el) { pick(el.dataset.v); },
    place(el) { if (locked()) return; const qi = run.ids[run.idx]; const cur = (run.ans[qi] || []).slice(); cur.push(Number(el.dataset.it)); setAns(cur); ui.focus = '.pill'; render(); },
    unplace(el) { if (locked()) return; const qi = run.ids[run.idx]; const cur = (run.ans[qi] || []).slice(); cur.splice(Number(el.dataset.k), 1); setAns(cur); ui.focus = '.pill'; render(); },
    clear() { if (locked()) return; setAns([]); render(); },
    check() { check(); },
    next() { go(run.idx + 1); },
    prev() { go(run.idx - 1); },
    goto(el) { go(Number(el.dataset.p)); },
    finish() { tryFinish(); },
    cancelfinish() { ui.confirm = null; render(); },
    confirmfinish() { finish(); },
    toresult() { ui.view = 'result'; render(); window.scrollTo(0, 0); },
    review(el) { run.idx = Number(el.dataset.p); ui.view = 'quiz'; ui.focus = '.qtext'; render(); window.scrollTo(0, 0); },
    retry() { const t = calc(set, run); const ids = t.wrong.map(p => run.ids[p]); const r = newRun(set, run.mode, ids, true); store.set(runKey(set.id, run.mode, true), r); openRun(set, r, 'quiz'); },
  };

  $app.addEventListener('click', e => {
    const hot = e.target.closest('.hot');
    if (hot && run && ui.view === 'quiz') { if (!locked()) { setAns(hot.getAttribute('data-id')); render(); const h = $app.querySelector('.hot.sel'); if (h) h.focus({ preventScroll: true }); } return; }
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'SELECT') return;
    if (el.getAttribute('aria-disabled') === 'true') return;
    const name = el.dataset.act;
    if (name !== 'arm' && name !== 'restart') ui.arm = null;
    if (act[name]) act[name](el);
  });
  $app.addEventListener('change', e => {
    const el = e.target;
    if (!(el.matches && el.matches('select[data-act="match"]')) || !run || locked()) return;
    const qi = run.ids[run.idx], q = set.qs[qi], choices = choicesOf(q);
    const cur = (run.ans[qi] || []).slice(); while (cur.length < q.pairs.length) cur.push(null);
    cur[Number(el.dataset.k)] = el.value === '' ? null : choices[Number(el.value)];
    setAns(cur); ui.focus = '#m' + el.dataset.k; render();
  });
  $app.addEventListener('keydown', e => {
    const hot = e.target.closest && e.target.closest('.hot');
    if (hot && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); hot.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  $app.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('jump')) ui.jumpOpen = e.target.open; }, true);

  document.addEventListener('keydown', e => {
    if (ui.view !== 'quiz' || !run || e.ctrlKey || e.metaKey || e.altKey) return;
    const ae = document.activeElement;
    const onOpt = !!(ae && ae.classList && ae.classList.contains('opt'));
    if (ae && ae !== document.body && ae.tagName !== 'H2' && !onOpt) return;
    if (onOpt && e.key === 'Enter' && !locked()) return;
    if (onOpt && e.key === 'Enter') e.preventDefault();
    const qi = run.ids[run.idx], q = set.qs[qi];
    if (e.key >= '1' && e.key <= '5' && !locked() && (q.t === 'mcq' || q.t === 'tf')) {
      const k = Number(e.key) - 1;
      if (q.t === 'mcq') { const p = perm(q.opts.length, run.seed, qi); if (k < p.length) pick(String(p[k])); }
      else if (k < 2) pick(k === 0 ? 'true' : 'false');
    } else if (e.key === 'ArrowRight' && run.idx < run.ids.length - 1) go(run.idx + 1);
    else if (e.key === 'ArrowLeft' && run.idx > 0) go(run.idx - 1);
    else if (e.key === 'Enter') {
      const fb = locked();
      if (!fb && ui.mode === 'practice' && (q.t === 'order' || q.t === 'match' || q.t === 'spot')) check();
      else if (run.idx < run.ids.length - 1) go(run.idx + 1);
      else if (!run.done) tryFinish();
    }
  });

  paintTheme();
  render();
})();

</script>
</body>
</html>
